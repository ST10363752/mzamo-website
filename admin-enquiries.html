<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Enquiries - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== ADMIN CONTENT ===== */
        .admin-content {
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-content h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 2rem;
        }
        .admin-content .subtitle {
            color: var(--mid-gray);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        /* ===== STATS BANNER ===== */
        .stats-banner {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stats-banner .stat-box {
            background: white;
            padding: 20px 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
        }
        .stats-banner .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .stats-banner .stat-box .number {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Playfair Display', serif;
        }
        .stats-banner .stat-box .label {
            color: var(--mid-gray);
            font-size: 0.9rem;
            display: block;
            margin-top: 2px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-box.new { border-bottom: 4px solid #007bff; }
        .stat-box.progress { border-bottom: 4px solid #ffc107; }
        .stat-box.resolved { border-bottom: 4px solid #28a745; }

        /* ===== TABLE ===== */
        .table-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table th {
            background: var(--primary);
            color: white;
            padding: 14px 18px;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        .admin-table tr:hover {
            background: #f8f9fa;
        }
        .admin-table tr:last-child td {
            border-bottom: none;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-new {
            background: #e3f0ff;
            color: #0056b3;
        }
        .status-in-progress {
            background: #fff3cd;
            color: #856404;
        }
        .status-resolved {
            background: #d4edda;
            color: #155724;
        }

        /* ===== MESSAGE TRUNCATE ===== */
        .message-preview {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
            color: var(--dark-gray);
            cursor: pointer;
        }
        .message-preview:hover {
            color: var(--primary);
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .actions .btn-view {
            background: var(--primary);
            color: white;
        }
        .actions .btn-view:hover {
            background: var(--primary-dark);
        }
        .actions .btn-progress {
            background: #ffc107;
            color: #333;
        }
        .actions .btn-progress:hover {
            background: #e0a800;
        }
        .actions .btn-resolve {
            background: #28a745;
            color: white;
        }
        .actions .btn-resolve:hover {
            background: #218838;
        }
        .actions .btn-delete {
            background: #dc3545;
            color: white;
        }
        .actions .btn-delete:hover {
            background: #c82333;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--mid-gray);
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .empty-state .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 15px;
        }
        .empty-state h3 {
            color: var(--dark-gray);
            margin-bottom: 10px;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary);
            font-weight: 600;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--secondary);
        }

        /* ===== TABLE COUNT ===== */
        .table-count {
            padding: 12px 18px;
            background: #f8f9fa;
            font-size: 0.85rem;
            color: var(--mid-gray);
            border-top: 1px solid #f0f0f0;
        }
        .table-count strong {
            color: var(--dark-gray);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .admin-table {
                font-size: 0.8rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 10px 12px;
            }
            .message-preview {
                max-width: 120px;
            }
        }

        @media (max-width: 768px) {
            .stats-banner {
                grid-template-columns: 1fr 1fr;
            }
            .admin-table {
                font-size: 0.7rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 8px 10px;
            }
            .actions button {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
            .message-preview {
                max-width: 80px;
            }
        }

        @media (max-width: 480px) {
            .stats-banner {
                grid-template-columns: 1fr;
            }
            .admin-content h1 {
                font-size: 1.5rem;
            }
            .admin-table {
                font-size: 0.6rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 6px 8px;
            }
            .message-preview {
                max-width: 60px;
            }
        }

        /* ===== MODAL FOR VIEWING ENQUIRY ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: white;
            max-width: 500px;
            width: 90%;
            padding: 35px;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-content .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--mid-gray);
            transition: var(--transition);
        }
        .modal-content .close-btn:hover {
            color: var(--primary);
        }
        .modal-content h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }
        .modal-content .detail-row {
            display: flex;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .modal-content .detail-row .label {
            font-weight: 600;
            width: 80px;
            flex-shrink: 0;
            color: var(--dark-gray);
        }
        .modal-content .detail-row .value {
            color: var(--text-color);
            word-break: break-word;
        }
        .modal-content .detail-row .value.status {
            font-weight: 600;
        }
        .modal-content .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-content .modal-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-content .modal-actions .btn-close-modal {
            background: var(--light-gray);
            color: var(--dark-gray);
        }
        .modal-content .modal-actions .btn-close-modal:hover {
            background: var(--mid-gray);
            color: white;
        }
    </style>
</head>
<body class="admin-body">

    <header class="admin-header">
        <nav class="admin-nav">
            <h1>Mzamo Admin</h1>
            <ul class="admin-nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-programmes.html">Programmes</a></li>
                <li><a href="admin-news.html">News</a></li>
                <li><a href="admin-reports.html">Reports</a></li>
                <li><a href="admin-enquiries.html" class="active">Enquiries</a></li>
                <li><a href="admin-login.html" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-content">
        <h1>Enquiries</h1>
        <p class="subtitle">View and manage all enquiries submitted through the website.</p>

        <div id="enquiriesContainer">
            <!-- Enquiries loaded by JavaScript -->
        </div>

        <a href="admin-dashboard.html" class="back-link">← Back to Dashboard</a>
    </main>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="enquiryModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2>Enquiry Details</h2>
            <div id="modalBody">
                <!-- Filled by JavaScript -->
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
        // ============================================================
        // LOAD ENQUIRIES FROM LOCALSTORAGE
        // ============================================================

        let currentEnquiryIndex = -1;

        document.addEventListener('DOMContentLoaded', function() {
            loadEnquiries();
        });

        function loadEnquiries() {
            const container = document.getElementById('enquiriesContainer');
            
            const enquiries = JSON.parse(localStorage.getItem('enquiries') || '[]');
            
            const newCount = enquiries.filter(e => e.status === 'New' || !e.status).length;
            const progressCount = enquiries.filter(e => e.status === 'In Progress').length;
            const resolvedCount = enquiries.filter(e => e.status === 'Resolved').length;
            
            if (enquiries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>No Enquiries Yet</h3>
                        <p>When someone submits an enquiry through the website, it will appear here.</p>
                        <a href="../contact.html" class="btn-primary" style="margin-top: 20px;">Go to Contact Page</a>
                    </div>
                `;
                return;
            }

            let statsHTML = `
                <div class="stats-banner">
                    <div class="stat-box new">
                        <span class="number">${newCount}</span>
                        <span class="label">New</span>
                    </div>
                    <div class="stat-box progress">
                        <span class="number">${progressCount}</span>
                        <span class="label">In Progress</span>
                    </div>
                    <div class="stat-box resolved">
                        <span class="number">${resolvedCount}</span>
                        <span class="label">Resolved</span>
                    </div>
                </div>
            `;

            let tableHTML = `
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Message</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            enquiries.forEach((enquiry, index) => {
                const date = new Date(enquiry.date);
                const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                
                let statusText = enquiry.status || 'New';
                let statusClass = 'status-new';
                if (statusText === 'In Progress') statusClass = 'status-in-progress';
                if (statusText === 'Resolved') statusClass = 'status-resolved';

                const messagePreview = enquiry.message.length > 40 ? 
                    enquiry.message.substring(0, 40) + '...' : 
                    enquiry.message;

                tableHTML += `
                    <tr>
                        <td><strong>${escapeHtml(enquiry.name)}</strong></td>
                        <td>${escapeHtml(enquiry.email)}</td>
                        <td>${escapeHtml(enquiry.phone || '—')}</td>
                        <td>
                            <span class="message-preview" onclick="viewEnquiry(${index})" title="Click to view full message">
                                ${escapeHtml(messagePreview)}
                            </span>
                        </td>
                        <td style="font-size:0.8rem; white-space:nowrap;">${formattedDate}</td>
                        <td>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </td>
                        <td>
                            <div class="actions">
                                <button class="btn-view" onclick="viewEnquiry(${index})" title="View full details">View</button>
                                ${statusText !== 'In Progress' ? `<button class="btn-progress" onclick="updateStatus(${index}, 'In Progress')" title="Mark as In Progress">Progress</button>` : ''}
                                ${statusText !== 'Resolved' ? `<button class="btn-resolve" onclick="updateStatus(${index}, 'Resolved')" title="Mark as Resolved">Resolve</button>` : ''}
                                <button class="btn-delete" onclick="deleteEnquiry(${index})" title="Delete enquiry">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                    <div class="table-count">
                        Total: <strong>${enquiries.length}</strong> enquiry(ies)
                    </div>
                </div>
            `;

            container.innerHTML = statsHTML + tableHTML;
        }

        // ===== HELPER: Escape HTML =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== VIEW ENQUIRY (Modal) =====
        function viewEnquiry(index) {
            const enquiries = JSON.parse(localStorage.getItem('enquiries') || '[]');
            const enquiry = enquiries[index];
            
            if (!enquiry) return;
            
            currentEnquiryIndex = index;
            
            const date = new Date(enquiry.date);
            const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
            
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-row">
                    <span class="label">Name</span>
                    <span class="value"><strong>${escapeHtml(enquiry.name)}</strong></span>
                </div>
                <div class="detail-row">
                    <span class="label">Email</span>
                    <span class="value">${escapeHtml(enquiry.email)}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Phone</span>
                    <span class="value">${escapeHtml(enquiry.phone || 'Not provided')}</span>
                </div>
                <div class="detail-row" style="flex-direction:column; align-items:flex-start; gap:5px;">
                    <span class="label" style="width:100%;">Message</span>
                    <span class="value" style="background:#f8f9fa; padding:12px; border-radius:8px; width:100%; line-height:1.6;">
                        ${escapeHtml(enquiry.message)}
                    </span>
                </div>
                <div class="detail-row">
                    <span class="label">Date</span>
                    <span class="value">${formattedDate}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Status</span>
                    <span class="value status"><span class="status-badge ${enquiry.status === 'Resolved' ? 'status-resolved' : enquiry.status === 'In Progress' ? 'status-in-progress' : 'status-new'}">${enquiry.status || 'New'}</span></span>
                </div>
                <div class="modal-actions">
                    ${enquiry.status !== 'In Progress' ? `<button class="btn-progress" onclick="updateStatusFromModal('In Progress')">Mark In Progress</button>` : ''}
                    ${enquiry.status !== 'Resolved' ? `<button class="btn-resolve" onclick="updateStatusFromModal('Resolved')">Mark Resolved</button>` : ''}
                    <button class="btn-close-modal" onclick="closeModal()">Close</button>
                </div>
            `;
            
            document.getElementById('enquiryModal').classList.add('show');
        }

        // ===== CLOSE MODAL =====
        function closeModal() {
            document.getElementById('enquiryModal').classList.remove('show');
        }

        // ===== UPDATE STATUS FROM MODAL =====
        function updateStatusFromModal(newStatus) {
            if (currentEnquiryIndex === -1) return;
            updateStatus(currentEnquiryIndex, newStatus);
            closeModal();
        }

        // ===== UPDATE STATUS =====
        function updateStatus(index, newStatus) {
            const enquiries = JSON.parse(localStorage.getItem('enquiries') || '[]');
            
            if (!enquiries[index]) return;
            
            enquiries[index].status = newStatus;
            localStorage.setItem('enquiries', JSON.stringify(enquiries));
            
            loadEnquiries();
        }

        // ===== DELETE ENQUIRY =====
        function deleteEnquiry(index) {
            if (!confirm('Are you sure you want to delete this enquiry?')) return;
            
            const enquiries = JSON.parse(localStorage.getItem('enquiries') || '[]');
            enquiries.splice(index, 1);
            localStorage.setItem('enquiries', JSON.stringify(enquiries));
            
            loadEnquiries();
        }

        // ===== CLOSE MODAL ON OVERLAY CLICK =====
        document.getElementById('enquiryModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
