<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Enquiries - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== FORCE LIGHT TABLE HEADERS ===== */
        .admin-table th {
            background: #f8f9fa !important;
            color: #555 !important;
            border-bottom: 2px solid #e8e8e8 !important;
            text-transform: uppercase !important;
            font-size: 0.75rem !important;
            letter-spacing: 0.8px !important;
            font-weight: 600 !important;
            padding: 16px 18px !important;
            text-align: left !important;
        }

        /* ===== ADMIN CONTENT ===== */
        .admin-content {
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-content h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .admin-content .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* ===== STATS BANNER ===== */
        .stats-banner {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            text-align: center;
            border-bottom: 4px solid #ddd;
            transition: all 0.3s ease;
        }
        .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .stat-box.new { border-bottom-color: #007bff; }
        .stat-box.progress { border-bottom-color: #ffc107; }
        .stat-box.resolved { border-bottom-color: #28a745; }

        .stat-box .number {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1a4a6b;
            display: block;
            line-height: 1;
        }
        .stat-box .label {
            color: #888;
            font-size: 0.85rem;
            display: block;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ===== TABLE ===== */
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table td {
            padding: 18px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            color: #444;
        }
        .admin-table tbody tr:last-child td {
            border-bottom: none;
        }
        .admin-table tbody tr:hover {
            background: #fafbfc;
        }

        /* ===== NAME CELL ===== */
        .contact-name strong {
            color: #1a4a6b;
            font-size: 0.95rem;
            display: block;
        }
        .contact-name small {
            color: #999;
            font-size: 0.75rem;
            margin-top: 2px;
            display: block;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-new {
            background: #e3f0ff;
            color: #0056b3;
        }
        .status-in-progress {
            background: #fff8e1;
            color: #8a6d00;
        }
        .status-resolved {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* ===== MESSAGE PREVIEW ===== */
        .message-preview {
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
            color: #666;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .message-preview:hover {
            color: #1a4a6b;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .btn-view {
            background: #e3f0ff;
            color: #0056b3;
        }
        .btn-view:hover {
            background: #0056b3;
            color: white;
        }
        .btn-progress {
            background: #fff8e1;
            color: #8a6d00;
        }
        .btn-progress:hover {
            background: #ffc107;
            color: #333;
        }
        .btn-resolve {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .btn-resolve:hover {
            background: #28a745;
            color: white;
        }
        .btn-delete {
            background: #fbe9e7;
            color: #c62828;
        }
        .btn-delete:hover {
            background: #dc3545;
            color: white;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .empty-state h3 {
            color: #555;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .empty-state p {
            color: #999;
            font-size: 0.95rem;
        }

        /* ===== TABLE COUNT ===== */
        .table-count {
            padding: 14px 18px;
            background: #fafbfc;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #f0f0f0;
        }
        .table-count strong {
            color: #333;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #1a4a6b;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #e8a838;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
            padding: 5px 10px;
        }
        .modal-content .close-btn:hover {
            color: #333;
        }
        .modal-content h2 {
            color: #1a4a6b;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }
        .detail-row {
            display: flex;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-row .label {
            font-weight: 600;
            width: 90px;
            flex-shrink: 0;
            color: #666;
            font-size: 0.85rem;
        }
        .detail-row .value {
            color: #333;
            word-break: break-word;
            font-size: 0.95rem;
        }
        .detail-row.message {
            flex-direction: column;
            gap: 8px;
        }
        .detail-row.message .label {
            width: 100%;
        }
        .detail-row.message .value {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            width: 100%;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .modal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .modal-actions .btn-progress {
            background: #ffc107;
            color: #333;
        }
        .modal-actions .btn-progress:hover {
            background: #e0a800;
        }
        .modal-actions .btn-resolve {
            background: #28a745;
            color: white;
        }
        .modal-actions .btn-resolve:hover {
            background: #218838;
        }
        .modal-actions .btn-close-modal {
            background: #f0f0f0;
            color: #555;
        }
        .modal-actions .btn-close-modal:hover {
            background: #e0e0e0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .stats-banner {
                grid-template-columns: 1fr 1fr;
            }
            .admin-table th,
            .admin-table td {
                padding: 12px 10px;
                font-size: 0.8rem;
            }
            .message-preview {
                max-width: 120px;
            }
            .actions {
                flex-direction: column;
            }
        }
        @media (max-width: 480px) {
            .stats-banner {
                grid-template-columns: 1fr;
            }
            .admin-content h1 {
                font-size: 1.5rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 10px 8px;
                font-size: 0.7rem;
            }
            .message-preview {
                max-width: 80px;
            }
        }
    </style>
</head>
<body class="admin-body">

    <header class="admin-header">
        <nav class="admin-nav">
            <h1>Mzamo Admin</h1>
            <ul class="admin-nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-programmes.html">Programmes</a></li>
                <li><a href="admin-news.html">News</a></li>
                <li><a href="admin-reports.html">Reports</a></li>
                <li><a href="admin-enquiries.html" class="active">Enquiries</a></li>
                <li><a href="admin-login.html" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-content">
        <h1>Enquiries</h1>
        <p class="subtitle">View and manage all enquiries submitted through the website.</p>

        <div id="enquiriesContainer"></div>

        <a href="admin-dashboard.html" class="back-link">Back to Dashboard</a>
    </main>

    <div class="modal-overlay" id="enquiryModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">X</button>
            <h2>Enquiry Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-enquiries.js"></script>
</body>
</html>
