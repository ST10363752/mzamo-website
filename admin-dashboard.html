<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <nav class="admin-nav">
            <h1>Mzamo Admin</h1>
            <ul class="admin-nav-links">
                <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
                <li><a href="admin-programmes.html">Programmes</a></li>
                <li><a href="admin-news.html">News</a></li>
                <li><a href="admin-reports.html">Reports</a></li>
                <li><a href="admin-enquiries.html">Enquiries</a></li>
                <li><a href="admin-login.html" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="dashboard-content">
        <h1>Dashboard</h1>
        <p>Welcome back, <strong id="adminName">Administrator</strong></p>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Programmes</h3>
                <p class="stat-number" id="programmeCount">0</p>
            </div>
            <div class="stat-card">
                <h3>News Items</h3>
                <p class="stat-number" id="newsCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Reports</h3>
                <p class="stat-number" id="reportCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Enquiries</h3>
                <p class="stat-number" id="enquiryCount">0</p>
            </div>
        </div>

        <div class="quick-actions">
            <h2>Quick Actions</h2>
            <div class="quick-grid">
                <a href="admin-programmes.html" class="quick-btn">Add Programme</a>
                <a href="admin-news.html" class="quick-btn">Create News</a>
                <a href="admin-reports.html" class="quick-btn">Upload Report</a>
                <a href="admin-enquiries.html" class="quick-btn">View Enquiries</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
