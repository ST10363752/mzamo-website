<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Reports - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== ADMIN CONTENT ===== */
        .admin-content {
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-content h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 2rem;
        }
        .admin-content .subtitle {
            color: var(--mid-gray);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        /* ===== UPLOAD FORM ===== */
        .upload-form {
            background: white;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: none;
            animation: slideDown 0.3s ease;
        }
        .upload-form.show {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .upload-form h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }
        .upload-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .upload-form .form-group {
            margin-bottom: 15px;
        }
        .upload-form .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--dark-gray);
            font-size: 0.9rem;
        }
        .upload-form .form-group input,
        .upload-form .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--off-white);
        }
        .upload-form .form-group input:focus,
        .upload-form .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(26, 74, 107, 0.1);
        }
        .upload-form .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .upload-form .form-actions .btn-primary {
            padding: 12px 35px;
        }
        .upload-form .form-actions .btn-secondary-form {
            padding: 12px 35px;
            background: var(--light-gray);
            color: var(--dark-gray);
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .upload-form .form-actions .btn-secondary-form:hover {
            background: var(--mid-gray);
            color: white;
        }
        .upload-form .form-message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            font-weight: 500;
        }
        .upload-form .form-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .upload-form .form-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ===== BUTTONS ===== */
        .add-btn {
            padding: 12px 30px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 25px;
            transition: var(--transition);
            font-size: 0.95rem;
        }
        .add-btn:hover {
            background: var(--secondary-dark);
            transform: translateY(-2px);
        }

        /* ===== TABLE ===== */
        .table-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table th {
            background: var(--primary);
            color: white;
            padding: 14px 18px;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        .admin-table tr:hover {
            background: #f8f9fa;
        }
        .admin-table tr:last-child td {
            border-bottom: none;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-public {
            background: #d4edda;
            color: #155724;
        }
        .status-internal {
            background: #fff3cd;
            color: #856404;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .actions .btn-download {
            background: var(--primary-light);
            color: white;
        }
        .actions .btn-download:hover {
            background: var(--primary-dark);
        }
        .actions .btn-edit {
            background: var(--secondary);
            color: white;
        }
        .actions .btn-edit:hover {
            background: var(--secondary-dark);
        }
        .actions .btn-delete {
            background: #dc3545;
            color: white;
        }
        .actions .btn-delete:hover {
            background: #c82333;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--mid-gray);
        }
        .empty-state .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 15px;
        }
        .empty-state h3 {
            color: var(--dark-gray);
            margin-bottom: 10px;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary);
            font-weight: 600;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--secondary);
        }

        /* ===== TABLE COUNT ===== */
        .table-count {
            padding: 12px 18px;
            background: #f8f9fa;
            font-size: 0.85rem;
            color: var(--mid-gray);
            border-top: 1px solid #f0f0f0;
        }
        .table-count strong {
            color: var(--dark-gray);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .upload-form .form-row {
                grid-template-columns: 1fr;
            }
            .admin-table {
                font-size: 0.8rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 10px 12px;
            }
            .actions button {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
        }
        @media (max-width: 480px) {
            .admin-content h1 {
                font-size: 1.5rem;
            }
            .upload-form {
                padding: 20px;
            }
            .admin-table {
                font-size: 0.7rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body class="admin-body">

    <header class="admin-header">
        <nav class="admin-nav">
            <h1>⭐ Mzamo Admin</h1>
            <ul class="admin-nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-programmes.html">Programmes</a></li>
                <li><a href="admin-news.html">News</a></li>
                <li><a href="admin-reports.html" class="active">Reports</a></li>
                <li><a href="admin-enquiries.html">Enquiries</a></li>
                <li><a href="admin-login.html" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-content">
        <h1>Reports & Documents</h1>
        <p class="subtitle">Upload, manage, and organise organisational reports and documents.</p>

        <button class="add-btn" id="showUploadBtn">+ Upload New Report</button>

        <!-- ===== UPLOAD FORM ===== -->
        <div class="upload-form" id="uploadForm">
            <h2>Upload New Report</h2>
            <form id="reportUploadForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reportTitle">Report Title *</label>
                        <input type="text" id="reportTitle" placeholder="e.g., Annual Report 2025" required>
                    </div>
                    <div class="form-group">
                        <label for="reportVisibility">Visibility *</label>
                        <select id="reportVisibility" required>
                            <option value="Public">Public</option>
                            <option value="Internal">Internal</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reportDescription">Description</label>
                    <input type="text" id="reportDescription" placeholder="Brief description of the report">
                </div>
                <div class="form-group">
                    <label for="reportFile">Select File (PDF, DOC, DOCX) *</label>
                    <input type="file" id="reportFile" accept=".pdf,.doc,.docx" required>
                    <small style="color: var(--mid-gray);">Maximum file size: 5MB</small>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Upload Report</button>
                    <button type="button" class="btn-secondary-form" id="cancelUploadBtn">Cancel</button>
                </div>
                <div id="uploadMessage" class="form-message"></div>
            </form>
        </div>

        <!-- ===== REPORTS TABLE ===== -->
        <div id="reportsContainer">
            <!-- Reports loaded by JavaScript -->
        </div>

        <a href="admin-dashboard.html" class="back-link">← Back to Dashboard</a>
    </main>

    <script src="js/main.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
        // ============================================================
        // REPORTS MANAGEMENT - WITH UPLOAD FUNCTIONALITY
        // ============================================================

        let reports = [];

        // ===== LOAD REPORTS ON PAGE LOAD =====
        document.addEventListener('DOMContentLoaded', function() {
            loadReports();
            setupEventListeners();
        });

        // ===== SETUP EVENT LISTENERS =====
        function setupEventListeners() {
            // Show upload form
            document.getElementById('showUploadBtn').addEventListener('click', function() {
                document.getElementById('uploadForm').classList.toggle('show');
                if (document.getElementById('uploadForm').classList.contains('show')) {
                    this.textContent = '− Close Upload Form';
                } else {
                    this.textContent = '+ Upload New Report';
                }
            });

            // Cancel upload
            document.getElementById('cancelUploadBtn').addEventListener('click', function() {
                document.getElementById('uploadForm').classList.remove('show');
                document.getElementById('showUploadBtn').textContent = '+ Upload New Report';
                document.getElementById('reportUploadForm').reset();
                document.getElementById('uploadMessage').style.display = 'none';
            });

            // Handle form submission
            document.getElementById('reportUploadForm').addEventListener('submit', function(e) {
                e.preventDefault();
                uploadReport();
            });
        }

        // ===== UPLOAD REPORT =====
        function uploadReport() {
            const title = document.getElementById('reportTitle').value.trim();
            const description = document.getElementById('reportDescription').value.trim();
            const visibility = document.getElementById('reportVisibility').value;
            const fileInput = document.getElementById('reportFile');
            const messageDiv = document.getElementById('uploadMessage');

            // Validate
            if (!title) {
                showUploadMessage('Please enter a report title.', 'error');
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                showUploadMessage('Please select a file to upload.', 'error');
                return;
            }

            const file = fileInput.files[0];
            
            // Check file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showUploadMessage('File is too large. Maximum size is 5MB.', 'error');
                return;
            }

            // Check file type
            const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
            if (!allowedTypes.includes(file.type)) {
                showUploadMessage('Only PDF, DOC, and DOCX files are allowed.', 'error');
                return;
            }

            // Read file as Base64
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = e.target.result;

                // Get existing reports
                let reports = JSON.parse(localStorage.getItem('reports') || '[]');

                // Create new report
                const newReport = {
                    id: Date.now(),
                    title: title,
                    description: description || '',
                    visibility: visibility,
                    fileName: file.name,
                    fileType: file.type,
                    fileSize: file.size,
                    fileData: fileData,
                    dateUploaded: new Date().toISOString()
                };

                reports.push(newReport);
                localStorage.setItem('reports', JSON.stringify(reports));
                localStorage.setItem('reportCount', reports.length);

                showUploadMessage(' Report uploaded successfully!', 'success');
                
                // Reset form
                document.getElementById('reportUploadForm').reset();
                document.getElementById('uploadForm').classList.remove('show');
                document.getElementById('showUploadBtn').textContent = '+ Upload New Report';

                // Reload reports
                loadReports();

                // Update dashboard count
                updateDashboardCount();
            };

            reader.onerror = function() {
                showUploadMessage('Error reading file. Please try again.', 'error');
            };

            reader.readAsDataURL(file);
        }

        // ===== SHOW UPLOAD MESSAGE =====
        function showUploadMessage(text, type) {
            const messageDiv = document.getElementById('uploadMessage');
            messageDiv.textContent = text;
            messageDiv.className = 'form-message ' + type;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // ===== LOAD REPORTS =====
        function loadReports() {
            const container = document.getElementById('reportsContainer');
            
            // Get reports from localStorage
            reports = JSON.parse(localStorage.getItem('reports') || '[]');
            
            if (reports.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon"></span>
                        <h3>No Reports Yet</h3>
                        <p>Upload your first report using the button above.</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Report Title</th>
                                <th>Description</th>
                                <th>Date Uploaded</th>
                                <th>Visibility</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            reports.forEach((report, index) => {
                const date = new Date(report.dateUploaded);
                const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                
                const statusClass = report.visibility === 'Public' ? 'status-public' : 'status-internal';
                
                tableHTML += `
                    <tr>
                        <td><strong>${escapeHtml(report.title)}</strong></td>
                        <td>${escapeHtml(report.description || '—')}</td>
                        <td style="font-size:0.8rem; white-space:nowrap;">${formattedDate}</td>
                        <td>
                            <span class="status-badge ${statusClass}">${report.visibility}</span>
                        </td>
                        <td>
                            <div class="actions">
                                <button class="btn-download" onclick="downloadReport(${index})">Download</button>
                                <button class="btn-edit" onclick="editReport(${index})">Edit</button>
                                <button class="btn-delete" onclick="deleteReport(${index})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                    <div class="table-count">
                        Total: <strong>${reports.length}</strong> report(s)
                    </div>
                </div>
            `;

            container.innerHTML = tableHTML;
        }

        // ===== DOWNLOAD REPORT =====
        function downloadReport(index) {
            const report = reports[index];
            if (!report) return;

            try {
                // Create a download link
                const link = document.createElement('a');
                link.href = report.fileData;
                link.download = report.fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                alert('Error downloading report. Please try again.');
                console.error('Download error:', error);
            }
        }

        // ===== EDIT REPORT =====
        function editReport(index) {
            const report = reports[index];
            if (!report) return;

            // Simple edit: update title and visibility
            const newTitle = prompt('Enter new title:', report.title);
            if (newTitle === null) return; // User cancelled
            if (newTitle.trim() === '') {
                alert('Title cannot be empty.');
                return;
            }

            const newVisibility = confirm('Click OK to make this report Public, or Cancel to keep it Internal.') ? 'Public' : 'Internal';

            reports[index].title = newTitle.trim();
            reports[index].visibility = newVisibility;
            localStorage.setItem('reports', JSON.stringify(reports));

            loadReports();
            updateDashboardCount();
        }

        // ===== DELETE REPORT =====
        function deleteReport(index) {
            if (!confirm('Are you sure you want to delete this report?')) return;
            
            reports.splice(index, 1);
            localStorage.setItem('reports', JSON.stringify(reports));
            localStorage.setItem('reportCount', reports.length);
            
            loadReports();
            updateDashboardCount();
        }

        // ===== UPDATE DASHBOARD COUNT =====
        function updateDashboardCount() {
            const count = reports.length;
            localStorage.setItem('reportCount', count);
            
            // If dashboard is open in another tab, it will update when refreshed
        }

        // ===== HELPER: Escape HTML =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        console.log(' Reports system loaded successfully!');
        console.log('   Total reports:', reports.length);
    </script>
</body>
</html>
