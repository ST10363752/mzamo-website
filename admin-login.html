<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mzamo Child Guidance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">

    <div class="login-box">
        <div class="login-header">
            <h1>🌟 Mzamo Admin</h1>
            <p>Administration Portal</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">Email Address</label>
                <input type="email" id="adminEmail" placeholder="admin@mzamo.org" required>
            </div>
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary">Log In</button>
            <div id="loginMessage" class="form-message"></div>
        </form>

        <a href="index.html" class="back-link">← Back to Website</a>
    </div>

    <script src="js/admin-auth.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-reports.js"></script>
    
</body>
</html>
