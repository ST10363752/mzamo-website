<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Programmes - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== ADMIN CONTENT ===== */
        .admin-content {
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-content h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .admin-content .subtitle {
            color: var(--mid-gray);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* ===== ADD FORM ===== */
        .add-form {
            background: white;
            padding: 30px 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: none;
            animation: slideDown 0.3s ease;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .add-form.show {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .add-form .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .add-form .form-header h2 {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0;
        }
        .add-form .form-header .form-id {
            color: var(--mid-gray);
            font-size: 0.8rem;
        }
        .add-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .add-form .form-group {
            margin-bottom: 18px;
        }
        .add-form .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }
        .add-form .form-group label .required {
            color: #dc3545;
            margin-left: 2px;
        }
        .add-form .form-group input,
        .add-form .form-group select,
        .add-form .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #d8d8d8;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: #fafafa;
            font-family: inherit;
            color: #333;
        }
        .add-form .form-group input:focus,
        .add-form .form-group select:focus,
        .add-form .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 74, 107, 0.08);
        }
        .add-form .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }
        .add-form .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        .add-form .form-actions .btn-primary {
            padding: 11px 35px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .add-form .form-actions .btn-secondary-form {
            padding: 11px 30px;
            background: #f0f0f0;
            color: #555;
            border: 1px solid #d8d8d8;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .add-form .form-actions .btn-secondary-form:hover {
            background: #e0e0e0;
            color: #333;
        }
        .add-form .form-message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .add-form .form-message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .add-form .form-message.error {
            display: block;
            background: #fbe9e7;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        /* ===== BUTTONS ===== */
        .add-btn {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 25px;
            transition: var(--transition);
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }
        .add-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26, 74, 107, 0.3);
        }
        .add-btn.active {
            background: #dc3545;
        }
        .add-btn.active:hover {
            background: #c82333;
        }

        /* ===== TABLE ===== */
        .table-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table th {
            background: #f8f9fa;
            color: #444;
            padding: 14px 18px;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e8e8e8;
        }
        .admin-table td {
            padding: 13px 18px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            color: #444;
        }
        .admin-table tr:hover {
            background: #fafbfc;
        }
        .admin-table tr:last-child td {
            border-bottom: none;
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-active {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-inactive {
            background: #fbe9e7;
            color: #c62828;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .actions .btn-edit {
            background: #ffc107;
            color: #333;
        }
        .actions .btn-edit:hover {
            background: #e0a800;
        }
        .actions .btn-toggle {
            background: #17a2b8;
            color: white;
        }
        .actions .btn-toggle:hover {
            background: #138496;
        }
        .actions .btn-delete {
            background: #dc3545;
            color: white;
        }
        .actions .btn-delete:hover {
            background: #c82333;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--mid-gray);
        }
        .empty-state .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 15px;
            color: #d0d0d0;
        }
        .empty-state h3 {
            color: var(--dark-gray);
            margin-bottom: 10px;
            font-weight: 500;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary);
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--secondary);
        }
        .back-link::before {
            content: '← ';
        }

        /* ===== TABLE COUNT ===== */
        .table-count {
            padding: 12px 18px;
            background: #fafbfc;
            font-size: 0.85rem;
            color: var(--mid-gray);
            border-top: 1px solid #f0f0f0;
        }
        .table-count strong {
            color: var(--dark-gray);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .add-form {
                padding: 20px;
            }
            .add-form .form-row {
                grid-template-columns: 1fr;
            }
            .admin-table {
                font-size: 0.8rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 10px 12px;
            }
            .actions button {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
        }
        @media (max-width: 480px) {
            .admin-content h1 {
                font-size: 1.5rem;
            }
            .add-form {
                padding: 15px;
            }
            .admin-table {
                font-size: 0.7rem;
            }
            .admin-table th,
            .admin-table td {
                padding: 8px 10px;
            }
            .add-form .form-actions {
                flex-direction: column;
            }
            .add-form .form-actions .btn-primary,
            .add-form .form-actions .btn-secondary-form {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body class="admin-body">

    <header class="admin-header">
        <nav class="admin-nav">
            <h1>Mzamo Admin</h1>
            <ul class="admin-nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-programmes.html" class="active">Programmes</a></li>
                <li><a href="admin-news.html">News</a></li>
                <li><a href="admin-reports.html">Reports</a></li>
                <li><a href="admin-enquiries.html">Enquiries</a></li>
                <li><a href="admin-login.html" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-content">
        <h1>Programmes & Services</h1>
        <p class="subtitle">Add, edit, or remove programmes and services offered by the organisation.</p>

        <button class="add-btn" id="showAddBtn">+ Add New Programme</button>

        <!-- ===== ADD/EDIT FORM ===== -->
        <div class="add-form" id="addForm">
            <div class="form-header">
                <h2 id="formTitle">Add New Programme</h2>
                <span class="form-id" id="formId"></span>
            </div>
            <form id="programmeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="programmeName">Programme Name <span class="required">*</span></label>
                        <input type="text" id="programmeName" placeholder="Enter programme name" required>
                    </div>
                    <div class="form-group">
                        <label for="programmeTarget">Target Group <span class="required">*</span></label>
                        <input type="text" id="programmeTarget" placeholder="Enter target group" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="programmeDescription">Description</label>
                    <textarea id="programmeDescription" placeholder="Enter a brief description of the programme..."></textarea>
                </div>
                <div class="form-group">
                    <label for="programmeStatus">Status</label>
                    <select id="programmeStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="formSubmitBtn">Add Programme</button>
                    <button type="button" class="btn-secondary-form" id="cancelFormBtn">Cancel</button>
                </div>
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>

        <!-- ===== PROGRAMMES TABLE ===== -->
        <div id="programmesContainer">
            <!-- Programmes loaded by JavaScript -->
        </div>

        <a href="admin-dashboard.html" class="back-link">Back to Dashboard</a>
    </main>

    <script src="js/main.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
        // ============================================================
        // PROGRAMMES MANAGEMENT
        // ============================================================

        let programmes = [];
        let editingIndex = -1;

        document.addEventListener('DOMContentLoaded', function() {
            loadProgrammes();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('showAddBtn').addEventListener('click', function() {
                resetForm();
                document.getElementById('addForm').classList.toggle('show');
                if (document.getElementById('addForm').classList.contains('show')) {
                    this.textContent = '− Cancel';
                    this.classList.add('active');
                } else {
                    this.textContent = '+ Add New Programme';
                    this.classList.remove('active');
                }
            });

            document.getElementById('cancelFormBtn').addEventListener('click', function() {
                document.getElementById('addForm').classList.remove('show');
                document.getElementById('showAddBtn').textContent = '+ Add New Programme';
                document.getElementById('showAddBtn').classList.remove('active');
                resetForm();
            });

            document.getElementById('programmeForm').addEventListener('submit', function(e) {
                e.preventDefault();
                saveProgramme();
            });
        }

        function saveProgramme() {
            const name = document.getElementById('programmeName').value.trim();
            const target = document.getElementById('programmeTarget').value.trim();
            const description = document.getElementById('programmeDescription').value.trim();
            const status = document.getElementById('programmeStatus').value;
            const messageDiv = document.getElementById('formMessage');

            if (!name) {
                showFormMessage('Please enter a programme name.', 'error');
                return;
            }
            if (!target) {
                showFormMessage('Please enter a target group.', 'error');
                return;
            }

            let programmes = JSON.parse(localStorage.getItem('programmes') || '[]');

            if (editingIndex === -1) {
                programmes.push({
                    id: Date.now(),
                    name: name,
                    target: target,
                    description: description || '',
                    status: status
                });
                showFormMessage('Programme added successfully.', 'success');
            } else {
                programmes[editingIndex].name = name;
                programmes[editingIndex].target = target;
                programmes[editingIndex].description = description || '';
                programmes[editingIndex].status = status;
                showFormMessage('Programme updated successfully.', 'success');
                editingIndex = -1;
                document.getElementById('formSubmitBtn').textContent = 'Add Programme';
                document.getElementById('formTitle').textContent = 'Add New Programme';
            }

            localStorage.setItem('programmes', JSON.stringify(programmes));
            localStorage.setItem('programmeCount', programmes.length);

            loadProgrammes();
            updateDashboardCount();

            setTimeout(() => {
                document.getElementById('addForm').classList.remove('show');
                document.getElementById('showAddBtn').textContent = '+ Add New Programme';
                document.getElementById('showAddBtn').classList.remove('active');
                resetForm();
            }, 1500);
        }

        function loadProgrammes() {
            const container = document.getElementById('programmesContainer');
            programmes = JSON.parse(localStorage.getItem('programmes') || '[]');
            
            if (programmes.length === 0) {
                const defaultProgrammes = [
                    { id: 1, name: 'Welfare Services', target: 'Children with disabilities', description: 'Psychological, social, physical, and cognitive development support.', status: 'Active' },
                    { id: 2, name: 'Professional Assessments', target: 'Children with disabilities', description: 'Multi-disciplinary evaluations by qualified professionals.', status: 'Active' },
                    { id: 3, name: 'Parent & Caregiver Training', target: 'Parents & caregivers', description: 'Workshops for parents and caregivers of children with cerebral palsy.', status: 'Active' },
                    { id: 4, name: 'Therapeutic Groups', target: 'Children with learning barriers', description: 'Support for children with learning barriers and low self-esteem.', status: 'Active' },
                    { id: 5, name: 'Awareness Programmes', target: 'Community', description: 'Community education on social issues and children\'s rights.', status: 'Active' },
                    { id: 6, name: 'Family Empowerment', target: 'Families', description: 'Skills training, support groups, and ongoing assistance for families.', status: 'Active' }
                ];
                localStorage.setItem('programmes', JSON.stringify(defaultProgrammes));
                localStorage.setItem('programmeCount', defaultProgrammes.length);
                programmes = defaultProgrammes;
            }

            if (programmes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📋</span>
                        <h3>No Programmes</h3>
                        <p>Add your first programme using the button above.</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Programme</th>
                                <th>Target Group</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            programmes.forEach((programme, index) => {
                const statusClass = programme.status === 'Active' ? 'status-active' : 'status-inactive';
                tableHTML += `
                    <tr>
                        <td><strong>${escapeHtml(programme.name)}</strong></td>
                        <td>${escapeHtml(programme.target)}</td>
                        <td>${escapeHtml(programme.description || '—')}</td>
                        <td><span class="status-badge ${statusClass}">${programme.status}</span></td>
                        <td>
                            <div class="actions">
                                <button class="btn-edit" onclick="editProgramme(${index})">Edit</button>
                                <button class="btn-toggle" onclick="toggleStatus(${index})">Toggle</button>
                                <button class="btn-delete" onclick="deleteProgramme(${index})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                    <div class="table-count">Total: <strong>${programmes.length}</strong> programme(s)</div>
                </div>
            `;

            container.innerHTML = tableHTML;
        }

        function editProgramme(index) {
            const programme = programmes[index];
            if (!programme) return;

            editingIndex = index;
            document.getElementById('programmeName').value = programme.name;
            document.getElementById('programmeTarget').value = programme.target;
            document.getElementById('programmeDescription').value = programme.description || '';
            document.getElementById('programmeStatus').value = programme.status;
            document.getElementById('formTitle').textContent = 'Edit Programme';
            document.getElementById('formSubmitBtn').textContent = 'Update Programme';
            document.getElementById('addForm').classList.add('show');
            document.getElementById('showAddBtn').textContent = '− Cancel';
            document.getElementById('showAddBtn').classList.add('active');
            document.getElementById('formMessage').style.display = 'none';
            document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleStatus(index) {
            const programme = programmes[index];
            if (!programme) return;
            programme.status = programme.status === 'Active' ? 'Inactive' : 'Active';
            localStorage.setItem('programmes', JSON.stringify(programmes));
            loadProgrammes();
        }

        function deleteProgramme(index) {
            if (!confirm('Are you sure you want to delete this programme?')) return;
            programmes.splice(index, 1);
            localStorage.setItem('programmes', JSON.stringify(programmes));
            localStorage.setItem('programmeCount', programmes.length);
            loadProgrammes();
            updateDashboardCount();
        }

        function resetForm() {
            document.getElementById('programmeForm').reset();
            document.getElementById('formMessage').style.display = 'none';
            editingIndex = -1;
            document.getElementById('formTitle').textContent = 'Add New Programme';
            document.getElementById('formSubmitBtn').textContent = 'Add Programme';
            document.getElementById('formId').textContent = '';
        }

        function showFormMessage(text, type) {
            const messageDiv = document.getElementById('formMessage');
            messageDiv.textContent = text;
            messageDiv.className = 'form-message ' + type;
            messageDiv.style.display = 'block';
            setTimeout(() => { messageDiv.style.display = 'none'; }, 4000);
        }

        function updateDashboardCount() {
            localStorage.setItem('programmeCount', programmes.length);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        console.log('Programmes system loaded successfully.');
        console.log('Total programmes:', programmes.length);
    </script>
</body>
</html>
