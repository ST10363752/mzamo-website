<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Programmes - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <nav class="admin-nav">
            <h1>Mzamo Admin</h1>
            <ul class="admin-nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-programmes.html" class="active">Programmes</a></li>
                <li><a href="admin-news.html">News</a></li>
                <li><a href="admin-reports.html">Reports</a></li>
                <li><a href="admin-enquiries.html">Enquiries</a></li>
                <li><a href="admin-login.html" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-content">
        <h1>Programmes & Services</h1>
        <p class="subtitle">Add, edit, or remove programmes and services offered by the organisation.</p>

        <button class="add-btn" id="showAddBtn">Add New Programme</button>

        <div class="add-form" id="addForm">
            <h2 id="formTitle">Add New Programme</h2>
            <form id="programmeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="programmeName">Programme Name *</label>
                        <input type="text" id="programmeName" required>
                    </div>
                    <div class="form-group">
                        <label for="programmeTarget">Target Group *</label>
                        <input type="text" id="programmeTarget" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="programmeDescription">Description</label>
                    <textarea id="programmeDescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="programmeStatus">Status</label>
                    <select id="programmeStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="formSubmitBtn">Add Programme</button>
                    <button type="button" class="btn-secondary-form" id="cancelFormBtn">Cancel</button>
                </div>
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>

        <div id="programmesContainer"></div>

        <a href="admin-dashboard.html" class="back-link">Back to Dashboard</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-programmes.js"></script>
</body>
</html>
