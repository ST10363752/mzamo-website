<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage News - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== FORCE LIGHT TABLE HEADERS ===== */
        .admin-table th {
            background: #f8f9fa !important;
            color: #555 !important;
            border-bottom: 2px solid #e8e8e8 !important;
            text-transform: uppercase !important;
            font-size: 0.75rem !important;
            letter-spacing: 0.8px !important;
            font-weight: 600 !important;
            padding: 16px 18px !important;
            text-align: left !important;
        }

        .admin-content {
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-content h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 2rem;
            font-weight: 600;
        }
        .admin-content .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .add-btn {
            padding: 12px 30px;
            background: #1a4a6b;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .add-btn:hover {
            background: #0d2f45;
        }

        .add-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 30px;
            display: none;
        }
        .add-form.show { display: block; }
        .add-form h2 {
            color: #1a4a6b;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        .add-form .form-group {
            margin-bottom: 18px;
        }
        .add-form .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 0.85rem;
        }
        .add-form .form-group input,
        .add-form .form-group textarea,
        .add-form .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #d8d8d8;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fafafa;
            font-family: inherit;
        }
        .add-form .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .add-form .form-group input:focus,
        .add-form .form-group textarea:focus,
        .add-form .form-group select:focus {
            outline: none;
            border-color: #1a4a6b;
            background: white;
        }
        .add-form .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .add-form .btn-primary {
            padding: 11px 35px;
            background: #1a4a6b;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .add-form .btn-primary:hover { background: #0d2f45; }
        .add-form .btn-secondary-form {
            padding: 11px 30px;
            background: #f0f0f0;
            color: #555;
            border: 1px solid #d8d8d8;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .add-form .form-message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            font-size: 0.9rem;
        }
        .add-form .form-message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .add-form .form-message.error {
            display: block;
            background: #fbe9e7;
            color: #c62828;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table td {
            padding: 18px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            color: #444;
        }
        .admin-table tbody tr:last-child td { border-bottom: none; }
        .admin-table tbody tr:hover { background: #fafbfc; }

        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-published { background: #e8f5e9; color: #2e7d32; }
        .status-draft { background: #fff3e0; color: #e65100; }
        .status-upcoming { background: #e3f2fd; color: #0d47a1; }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-edit:hover { background: #e0a800; }
        .btn-toggle { background: #17a2b8; color: white; }
        .btn-toggle:hover { background: #138496; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete:hover { background: #c82333; }

        .table-count {
            padding: 14px 18px;
            background: #fafbfc;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #f0f0f0;
        }
        .table-count strong { color: #333; }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 10px;
        }
        .empty-state h3 { color: #555; margin-bottom: 10px; font-weight: 500; }
        .empty-state p { color: #999; font-size: 0.95rem; }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #1a4a6b;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: #e8a838; }
    </style>
</head>
<body class="admin-body">

    <header class="admin-header">
        <nav class="admin-nav">
            <h1>Mzamo Admin</h1>
            <ul class="admin-nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-programmes.html">Programmes</a></li>
                <li><a href="admin-news.html" class="active">News</a></li>
                <li><a href="admin-reports.html">Reports</a></li>
                <li><a href="admin-enquiries.html">Enquiries</a></li>
                <li><a href="admin-login.html" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-content">
        <h1>News & Updates</h1>
        <p class="subtitle">Create, edit, or remove news articles and updates.</p>

        <button class="add-btn" id="showAddBtn">Add New Article</button>

        <div class="add-form" id="addForm">
            <h2 id="formTitle">Add New Article</h2>
            <form id="newsForm">
                <div class="form-group">
                    <label for="newsTitle">Article Title *</label>
                    <input type="text" id="newsTitle" required>
                </div>
                <div class="form-group">
                    <label for="newsContent">Content *</label>
                    <textarea id="newsContent" required></textarea>
                </div>
                <div class="form-group">
                    <label for="newsStatus">Status</label>
                    <select id="newsStatus">
                        <option value="Published">Published</option>
                        <option value="Draft">Draft</option>
                        <option value="Upcoming">Upcoming</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="formSubmitBtn">Add Article</button>
                    <button type="button" class="btn-secondary-form" id="cancelFormBtn">Cancel</button>
                </div>
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>

        <div id="newsContainer"></div>

        <a href="admin-dashboard.html" class="back-link">Back to Dashboard</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin-news.js"></script>
</body>
</html>
