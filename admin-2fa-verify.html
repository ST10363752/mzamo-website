<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify 2FA - Mzamo Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d2f45 0%, #1a4a6b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
        }
        .verify-box {
            background: white;
            max-width: 420px;
            width: 100%;
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .verify-box .lock-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .verify-box h1 {
            color: #1a4a6b;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .verify-box .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9rem;
            text-align: left;
        }
        .form-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 10px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #1a4a6b;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a4a6b;
            box-shadow: 0 0 0 4px rgba(26, 74, 107, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #e8a838;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .btn-primary:hover {
            background: #c48a2a;
        }
        .message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .message.error {
            display: block;
            background: #fbe9e7;
            color: #c62828;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1a4a6b;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #e8a838;
        }
    </style>
</head>
<body>

    <div class="verify-box">
        <div class="lock-icon">&#128274;</div>
        <h1>Two-Factor Authentication</h1>
        <p class="subtitle">Enter the 6-digit code from your authenticator app to continue.</p>

        <form id="verifyForm">
            <div class="form-group">
                <label for="verifyCode">Verification Code</label>
                <input type="text" id="verifyCode" maxlength="6" placeholder="000000" pattern="[0-9]{6}" autofocus required>
            </div>
            <button type="submit" class="btn-primary">Verify</button>
        </form>

        <div id="verifyMessage" class="message"></div>

        <a href="admin-login.html" class="back-link">Back to login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
    <script src="js/error-handler.js"></script>
    <script src="js/admin-2fa.js"></script>
</body>
</html>
